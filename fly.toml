app = 'hub-granmarquise'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = "hub_data"
  destination = "/app/data"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
