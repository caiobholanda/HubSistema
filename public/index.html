<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub Gran Marquise</title>
  <meta name="description" content="Central de acesso aos sistemas internos do Hotel Gran Marquise." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    :root { --gm-bg: #202C28; }
    html[data-theme="light"] { --gm-bg: #ECE4D2; }
    body { background: var(--gm-bg); transition: background 600ms cubic-bezier(0.16,1,0.3,1); }
    #root { min-height: 100vh; min-height: 100dvh; }
    img { max-width: 100%; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156,88,67,0.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156,88,67,0.45); }
    ::selection { background: rgba(156,88,67,0.25); }
  </style>
</head>
<body>
  <div id="root"></div>
  <!--
    URGENTE 2026-06-16: @babel/standalone v8.0.0 quebrou <script type="text/babel">.
    Versão pinada em 7.x estável + handler de erro visível na tela.
  -->
  <div id="root-fallback" style="display:none;padding:2rem;color:#ECE4D2;font-family:system-ui,sans-serif;max-width:720px;margin:60px auto">
    <h1 style="font-weight:300;font-size:1.8rem;margin-bottom:1rem;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">Hub Gran Marquise</h1>
    <p style="color:#C8B89A;line-height:1.6">Ocorreu um erro ao carregar a interface. Veja o console (F12) para detalhes.</p>
    <pre id="root-fallback-err" style="margin-top:1.5rem;padding:1rem;background:rgba(255,255,255,0.05);border-left:3px solid #9C5843;font-family:'JetBrains Mono',monospace;font-size:.78rem;overflow:auto;white-space:pre-wrap"></pre>
    <p style="margin-top:1.5rem;color:#8A7B6A;font-size:.85rem">Tente recarregar a página (Ctrl+Shift+R para forçar). Se persistir, contate o TI.</p>
  </div>
  <script>
    // Captura qualquer erro do Babel/JSX e expõe na tela.
    function _hubMostrarErro(msg) {
      var fb = document.getElementById('root-fallback');
      var pre = document.getElementById('root-fallback-err');
      if (fb) fb.style.display = 'block';
      if (pre) pre.textContent = (pre.textContent ? pre.textContent + '\n' : '') + msg;
    }
    window.addEventListener('error', function(e) {
      _hubMostrarErro((e.error && e.error.stack) || e.message || String(e));
    });
    window.addEventListener('unhandledrejection', function(e) {
      _hubMostrarErro('Promise rejeitada: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
    });
  </script>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('gm-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="./HubMarquise.jsx?v=20260803a"></script>
  <script>
    // Monta o React quando HubMarquise está disponível como global.
    // Timeout 8s de segurança: se não montar, mostra erro visível.
    var _start = Date.now();
    var _check = setInterval(function() {
      if (typeof HubMarquise !== 'undefined') {
        clearInterval(_check);
        try {
          ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(HubMarquise));
        } catch (e) {
          _hubMostrarErro('Falha ao montar React: ' + (e.stack || e.message));
        }
      } else if (Date.now() - _start > 8000) {
        clearInterval(_check);
        _hubMostrarErro('Timeout: o componente HubMarquise não foi carregado após 8s. Verifique se HubMarquise.jsx terminou de executar.');
      }
    }, 50);
  </script>
<script>(function(){var off=function(){document.querySelectorAll('input,textarea,select').forEach(function(el){if(!el.dataset.acSet){el.setAttribute('autocomplete','off');el.dataset.acSet='1';}});};off();new MutationObserver(off).observe(document.documentElement,{childList:true,subtree:true});})();</script>
</body>
</html>
