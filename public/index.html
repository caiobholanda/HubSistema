<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub de Sistemas — Gran Marquise TI</title>
  <meta name="description" content="Central de acesso aos sistemas internos do Hotel Gran Marquise." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #0A0E1A; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(201,169,97,0.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(201,169,97,0.45); }
    ::selection { background: rgba(201,169,97,0.25); }
  </style>
</head>
<body>
  <div id="root"></div>
  <!--
    URGENTE 2026-06-16: @babel/standalone foi atualizado para v8.0.0 com
    breaking changes — passou a interpretar <script type="text/babel">
    como ES module, quebrando código que usa globals (React, ReactDOM).
    Fixamos a versão em 7.x estável + data-type="script" para forçar
    sourceType='script' explícito. Versão major (8.x) NÃO pode entrar
    sem migração para Vite/build real.
  -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <script type="text/babel" data-type="script" data-presets="react" src="./HubMarquise.jsx"></script>
  <script>
    var _check = setInterval(function() {
      if (typeof HubMarquise !== 'undefined') {
        clearInterval(_check);
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(HubMarquise));
      }
    }, 50);
  </script>
</body>
</html>
