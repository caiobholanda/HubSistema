<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar conta — Gran Marquise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  :root {
    --noite: #202C28;
    --champanhe: #9C5843;
    --marfim: #ECE4D2;
    --areia: #C8B89A;
    --areiaDim: #8A7B6A;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    background:
      radial-gradient(ellipse 90% 55% at 12% 8%, rgba(156,88,67,0.08) 0%, transparent 65%),
      radial-gradient(ellipse 65% 75% at 88% 92%, rgba(42,90,107,0.05) 0%, transparent 65%),
      var(--noite);
    color: var(--marfim);
    font-family: Inter, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(156,88,67,0.25); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(156,88,67,0.45); }
  ::selection { background: rgba(156,88,67,0.25); }

  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px var(--noite) inset !important;
    -webkit-text-fill-color: var(--marfim) !important;
    caret-color: var(--marfim);
    transition: background-color 5000s ease-in-out 0s;
  }

  .accent-line {
    position: fixed; right: 0; top: 0; width: 1px; height: 60%;
    background: linear-gradient(180deg, transparent 0%, rgba(156,88,67,0.33) 40%, transparent 100%);
    pointer-events: none;
  }

  .wrap { width: 100%; max-width: 400px; }

  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--champanhe); margin-bottom: 28px;
    display: flex; align-items: center; gap: 10px;
  }
  .kicker::before { content: ''; display: block; width: 18px; height: 1px; background: var(--champanhe); }

  h1 {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 300; font-style: italic; font-size: clamp(30px, 9vw, 40px);
    letter-spacing: -0.02em; color: var(--marfim);
    margin: 0 0 20px; line-height: 1.05;
  }

  label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--areiaDim); margin-bottom: 8px; display: block;
  }

  input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(138,123,106,0.27);
    border-radius: 0; color: var(--marfim);
    font-family: Inter, sans-serif; font-size: 16px;
    padding: 14px 16px; outline: none; margin-bottom: 16px;
    transition: border-color 300ms var(--ease);
  }
  input:focus { border-color: rgba(156,88,67,0.53); }

  .strength { display: flex; align-items: center; gap: 12px; margin: 2px 0 14px; }
  .sbars { flex: 1; display: flex; gap: 4px; }
  .sbar { flex: 1; height: 3px; background: rgba(138,123,106,0.22); overflow: hidden; }
  .sbar i {
    display: block; height: 100%; background: #7cb342;
    transform: scaleX(0); transform-origin: left;
    transition: transform 420ms var(--ease), background 320ms;
  }
  .sbar:nth-child(2) i { transition-delay: 50ms, 0ms; }
  .sbar:nth-child(3) i { transition-delay: 100ms, 0ms; }
  .sbar:nth-child(4) i { transition-delay: 150ms, 0ms; }
  .sbar:nth-child(5) i { transition-delay: 200ms, 0ms; }
  .sbar.on i { transform: scaleX(1); }
  .slabel {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--areiaDim); min-width: 48px; text-align: right;
    transition: color 320ms;
  }
  .criteria { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 22px; }
  .criterion {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em; color: var(--areiaDim);
    transition: color 250ms;
  }
  .criterion .check {
    width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid rgba(138,123,106,0.4);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background 300ms var(--ease), border-color 300ms var(--ease);
  }
  .criterion .check svg { width: 9px; height: 9px; display: block; }
  .criterion .check path {
    stroke: var(--noite); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    fill: none; stroke-dasharray: 14; stroke-dashoffset: 14;
  }
  .criterion.ok { color: #7cb342; }
  .criterion.ok .check { background: #7cb342; border-color: #7cb342; animation: pop 360ms var(--ease); }
  .criterion.ok .check path { animation: draw 320ms var(--ease) 90ms forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { 0% { transform: scale(0.55); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }

  button {
    width: 100%; background: transparent;
    border: 1px solid rgba(156,88,67,0.67); border-radius: 0;
    color: var(--champanhe); padding: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer;
    transition: background 300ms var(--ease), border-color 250ms var(--ease);
  }
  button:hover:not(:disabled) { background: rgba(156,88,67,0.1); border-color: var(--champanhe); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .msg {
    font-family: Inter, sans-serif; font-size: 14px;
    line-height: 1.6; margin-bottom: 24px; color: var(--areia);
  }

  .err {
    font-family: Inter, sans-serif; font-size: 13px;
    color: #E07A5F; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .err::before { content: '—'; }

  .success { text-align: center; padding-top: 8px; }
  .success h1 { color: #7cb342; font-style: normal; margin-bottom: 16px; }

  a { color: var(--champanhe); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="accent-line"></div>
<div class="wrap">
  <div class="kicker">Gran Marquise — TI</div>
  <div id="root"></div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var t = params.get('t') || '';
  var root = document.getElementById('root');

  function criteCheck(s) {
    return [
      { label: '8 caracteres', ok: s.length >= 8 },
      { label: 'Maiúscula', ok: /[A-Z]/.test(s) },
      { label: 'Minúscula', ok: /[a-z]/.test(s) },
      { label: 'Número', ok: /[0-9]/.test(s) },
      { label: 'Especial', ok: /[^A-Za-z0-9]/.test(s) },
    ];
  }

  if (!t) {
    root.innerHTML = '<h1>Link inválido.</h1><p class="msg">Este link de ativação é inválido ou expirou. Solicite um novo ao TI.</p>';
    return;
  }

  var state = { senha: '', saving: false };
  var NIVEIS = { 1: ['Fraca', '#E07A5F'], 2: ['Fraca', '#E07A5F'], 3: ['Média', '#D4AC0D'], 4: ['Boa', '#AEB84B'], 5: ['Forte', '#7cb342'] };
  var CHECK_SVG = '<svg viewBox="0 0 12 12"><path d="M2.5 6.4l2.5 2.5 4.6-5.2"/></svg>';

  var crites = criteCheck('');
  root.innerHTML =
    '<h1>Criar senha.</h1>' +
    '<p class="msg">Bem-vindo(a)! Defina sua senha de acesso ao portal Gran Marquise.</p>' +
    '<div class="err" id="err" style="display:none"></div>' +
    '<label>Nova senha</label>' +
    '<input id="s1" type="password" autocomplete="new-password" placeholder="Digite sua nova senha">' +
    '<div class="strength">' +
    '<div class="sbars">' + crites.map(function () { return '<span class="sbar"><i></i></span>'; }).join('') + '</div>' +
    '<span class="slabel" id="slabel">—</span>' +
    '</div>' +
    '<div class="criteria">' + crites.map(function (c, i) {
      return '<span class="criterion" id="crit' + i + '"><span class="check">' + CHECK_SVG + '</span>' + c.label + '</span>';
    }).join('') + '</div>' +
    '<button id="btn" disabled>Ativar conta</button>';

  var s1 = document.getElementById('s1');
  var btn = document.getElementById('btn');
  var errEl = document.getElementById('err');
  var slabel = document.getElementById('slabel');
  var sbars = root.querySelectorAll('.sbar');

  function update() {
    var cs = criteCheck(state.senha);
    var score = cs.filter(function (c) { return c.ok; }).length;
    cs.forEach(function (c, i) {
      document.getElementById('crit' + i).classList.toggle('ok', c.ok);
    });
    var nivel = NIVEIS[score];
    sbars.forEach(function (b, i) {
      b.classList.toggle('on', i < score);
      b.querySelector('i').style.background = nivel ? nivel[1] : '#7cb342';
    });
    slabel.textContent = nivel ? nivel[0] : '—';
    slabel.style.color = nivel ? nivel[1] : '';
    btn.disabled = score < cs.length || state.saving;
  }

  s1.addEventListener('input', function (e) {
    state.senha = e.target.value;
    update();
  });
  s1.focus();

  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    state.saving = true;
    errEl.style.display = 'none';
    btn.textContent = 'Aguarde...';
    update();
    fetch('/api/ativar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: t, senha: state.senha }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok) {
          root.innerHTML = '<div class="success"><h1>Conta ativada!</h1><p class="msg">Sua senha foi definida com sucesso.<br><a href="/">Acessar o Hub Gran Marquise</a></p></div>';
        } else {
          state.saving = false;
          errEl.textContent = d.erro || 'Erro ao ativar. Tente novamente.';
          errEl.style.display = 'flex';
          btn.textContent = 'Ativar conta';
          update();
        }
      })
      .catch(function () {
        state.saving = false;
        errEl.textContent = 'Erro de conexão. Tente novamente.';
        errEl.style.display = 'flex';
        btn.textContent = 'Ativar conta';
        update();
      });
  });
}());
</script>
<script>(function(){var off=function(){document.querySelectorAll('input,textarea,select').forEach(function(el){if(!el.dataset.acSet){el.setAttribute('autocomplete','off');el.dataset.acSet='1';}});};off();new MutationObserver(off).observe(document.documentElement,{childList:true,subtree:true});})();</script>
</body>
</html>
