<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar conta — Gran Marquise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  :root {
    --noite: #202C28;
    --champanhe: #9C5843;
    --marfim: #ECE4D2;
    --areia: #C8B89A;
    --areiaDim: #8A7B6A;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    background:
      radial-gradient(ellipse 90% 55% at 12% 8%, rgba(156,88,67,0.08) 0%, transparent 65%),
      radial-gradient(ellipse 65% 75% at 88% 92%, rgba(42,90,107,0.05) 0%, transparent 65%),
      var(--noite);
    color: var(--marfim);
    font-family: Inter, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(156,88,67,0.25); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(156,88,67,0.45); }
  ::selection { background: rgba(156,88,67,0.25); }

  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px var(--noite) inset !important;
    -webkit-text-fill-color: var(--marfim) !important;
    caret-color: var(--marfim);
    transition: background-color 5000s ease-in-out 0s;
  }

  .accent-line {
    position: fixed; right: 0; top: 0; width: 1px; height: 60%;
    background: linear-gradient(180deg, transparent 0%, rgba(156,88,67,0.33) 40%, transparent 100%);
    pointer-events: none;
  }

  .wrap { width: 100%; max-width: 400px; }

  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--champanhe); margin-bottom: 28px;
    display: flex; align-items: center; gap: 10px;
  }
  .kicker::before { content: ''; display: block; width: 18px; height: 1px; background: var(--champanhe); }

  h1 {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 300; font-style: italic; font-size: 40px;
    letter-spacing: -0.02em; color: var(--marfim);
    margin: 0 0 20px; line-height: 1.05;
  }

  label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--areiaDim); margin-bottom: 8px; display: block;
  }

  input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(138,123,106,0.27);
    border-radius: 0; color: var(--marfim);
    font-family: Inter, sans-serif; font-size: 14px;
    padding: 14px 16px; outline: none; margin-bottom: 16px;
    transition: border-color 300ms var(--ease);
  }
  input:focus { border-color: rgba(156,88,67,0.53); }

  .criteria { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .criterion {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em; color: var(--areiaDim);
    transition: color 200ms;
  }
  .criterion.ok { color: #7cb342; }

  button {
    width: 100%; background: transparent;
    border: 1px solid rgba(156,88,67,0.67); border-radius: 0;
    color: var(--champanhe); padding: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer;
    transition: background 300ms var(--ease), border-color 250ms var(--ease);
  }
  button:hover:not(:disabled) { background: rgba(156,88,67,0.1); border-color: var(--champanhe); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .msg {
    font-family: Inter, sans-serif; font-size: 14px;
    line-height: 1.6; margin-bottom: 24px; color: var(--areia);
  }

  .err {
    font-family: Inter, sans-serif; font-size: 13px;
    color: #E07A5F; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .err::before { content: '—'; }

  .success { text-align: center; padding-top: 8px; }
  .success h1 { color: #7cb342; font-style: normal; margin-bottom: 16px; }

  a { color: var(--champanhe); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="accent-line"></div>
<div class="wrap">
  <div class="kicker">Gran Marquise — TI</div>
  <div id="root"></div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var t = params.get('t') || '';
  var root = document.getElementById('root');

  function criteCheck(s) {
    return [
      { label: '8 caracteres', ok: s.length >= 8 },
      { label: 'Maiúscula', ok: /[A-Z]/.test(s) },
      { label: 'Minúscula', ok: /[a-z]/.test(s) },
      { label: 'Número', ok: /[0-9]/.test(s) },
      { label: 'Especial', ok: /[^A-Za-z0-9]/.test(s) },
    ];
  }

  if (!t) {
    root.innerHTML = '<h1>Link inválido.</h1><p class="msg">Este link de ativação é inválido ou expirou. Solicite um novo ao TI.</p>';
    return;
  }

  var state = { senha: '', saving: false, erro: '', done: false };

  function render() {
    if (state.done) {
      root.innerHTML = '<div class="success"><h1>Conta ativada!</h1><p class="msg">Sua senha foi definida com sucesso.<br><a href="/">Acessar o Hub Gran Marquise</a></p></div>';
      return;
    }

    var crites = criteCheck(state.senha);
    var allOk = crites.every(function (c) { return c.ok; });

    var critesHtml = crites.map(function (c) {
      return '<span class="criterion' + (c.ok ? ' ok' : '') + '">' + (c.ok ? '✔' : '✗') + ' ' + c.label + '</span>';
    }).join('');

    var errHtml = state.erro ? '<div class="err">' + state.erro + '</div>' : '';

    root.innerHTML =
      '<h1>Criar senha.</h1>' +
      '<p class="msg">Bem-vindo(a)! Defina sua senha de acesso ao portal Gran Marquise.</p>' +
      errHtml +
      '<label>Nova senha</label>' +
      '<input id="s1" type="password" autocomplete="new-password" placeholder="Mín. 8 chars, maiúscula, número, especial">' +
      '<div class="criteria">' + critesHtml + '</div>' +
      '<button id="btn"' + ((!allOk || state.saving) ? ' disabled' : '') + '>' +
      (state.saving ? 'Aguarde...' : 'Ativar conta') +
      '</button>';

    var s1 = document.getElementById('s1');
    s1.value = state.senha;
    s1.addEventListener('input', function (e) {
      state.senha = e.target.value;
      render();
    });
    s1.focus();

    if (allOk && !state.saving) {
      document.getElementById('btn').addEventListener('click', function () {
        state.saving = true;
        state.erro = '';
        render();
        fetch('/api/ativar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: t, senha: state.senha }),
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.ok) {
              state.done = true;
              render();
            } else {
              state.erro = d.erro || 'Erro ao ativar. Tente novamente.';
              state.saving = false;
              render();
            }
          })
          .catch(function () {
            state.erro = 'Erro de conexão. Tente novamente.';
            state.saving = false;
            render();
          });
      });
    }
  }

  render();
}());
</script>
</body>
</html>
