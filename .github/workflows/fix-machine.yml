name: Fix Machine

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Diagnostico
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== machines ==="
          flyctl machine list --app hub-granmarquise || true
          echo "=== volumes ==="
          flyctl volumes list --app hub-granmarquise || true
          echo "=== releases ==="
          flyctl releases list --app hub-granmarquise --json | jq '.[0:3]' || true
      - name: Redeploy em MIA (GRU sem capacity)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          sed -i "s/primary_region = 'gru'/primary_region = 'mia'/" fly.toml
          cat fly.toml | grep primary_region
          flyctl deploy --remote-only
      - name: Verificar resultado
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl machine list --app hub-granmarquise || true
