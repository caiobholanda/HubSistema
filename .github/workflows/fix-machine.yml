name: Fix Machine

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Listar machines
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl machine list --app hub-granmarquise
      - name: Tentar machine run direto com volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Descobre a ultima imagem deployada
          IMAGE=$(flyctl releases list --app hub-granmarquise --json 2>/dev/null | jq -r '.[0].ImageRef' 2>/dev/null || echo "")
          if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
            IMAGE="registry.fly.io/hub-granmarquise:latest"
          fi
          echo "Usando imagem: $IMAGE"
          flyctl machine run "$IMAGE" \
            --app hub-granmarquise \
            --region gru \
            --volume vol_rkgj7okkq839k6o4:/app/data \
            --port 443:3000/tcp:tls:http \
            --port 80:3000/tcp:http \
            --vm-size shared-cpu-1x \
            --vm-memory 256 || true
      - name: Aguardar e verificar
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          sleep 15
          flyctl machine list --app hub-granmarquise
