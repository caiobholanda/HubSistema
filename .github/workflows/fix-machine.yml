name: Fix Machine

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Diagnostico
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== machines ==="
          flyctl machine list --app hub-granmarquise || true
          echo "=== volumes ==="
          flyctl volumes list --app hub-granmarquise || true
          echo "=== releases ==="
          flyctl releases list --app hub-granmarquise --json | jq '.[0:3]' || true
      - name: Criar volume hub_data em MIA e redeploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== Criando volume hub_data em MIA ==="
          flyctl volumes create hub_data --region mia --size 1 --app hub-granmarquise --yes
          echo "=== Atualizando região e deployando ==="
          sed -i "s/primary_region = 'gru'/primary_region = 'mia'/" fly.toml
          flyctl deploy --remote-only
      - name: Verificar resultado
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl machine list --app hub-granmarquise || true
