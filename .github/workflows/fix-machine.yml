name: Fix Machine

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Listar machines
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl machine list --app hub-granmarquise
      - name: Tentar iniciar machines paradas
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          IDS=$(flyctl machine list --app hub-granmarquise --json | jq -r '.[] | select(.state != "started") | .id' 2>/dev/null || echo "")
          if [ -n "$IDS" ]; then
            for id in $IDS; do
              echo "Iniciando machine $id..."
              flyctl machine start "$id" --app hub-granmarquise || true
            done
          else
            echo "Nenhuma machine parada encontrada"
          fi
      - name: Aguardar e verificar
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          sleep 10
          flyctl machine list --app hub-granmarquise
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app hub-granmarquise
