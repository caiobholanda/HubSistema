name: Fix Machine

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Diagnostico
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== machines ==="
          flyctl machine list --app hub-granmarquise || true
          echo "=== volumes ==="
          flyctl volumes list --app hub-granmarquise || true
          echo "=== releases ==="
          flyctl releases list --app hub-granmarquise --json | jq '.[0:3]' || true
      - name: Tentar criar volume novo e redeploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Tentando criar novo volume hub_data_2 em GRU..."
          NEW_VOL=$(flyctl volumes create hub_data_2 --region gru --size 1 --app hub-granmarquise --json 2>/dev/null | jq -r '.id' || echo "")
          echo "Novo volume: $NEW_VOL"
          if [ -z "$NEW_VOL" ] || [ "$NEW_VOL" = "null" ]; then
            echo "Falha ao criar volume em GRU - GRU sem capacity"
            exit 1
          fi
          echo "Volume criado! Atualizando fly.toml..."
          sed -i "s/source = \"hub_data\"/source = \"hub_data_2\"/" fly.toml
          cat fly.toml | grep source
          flyctl deploy --remote-only
      - name: Verificar resultado
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl machine list --app hub-granmarquise || true
