name: Deploy to Fly.io

on:
  push:
    branches: [main]
    # Nao redeploya por commits que so mudam dados (auto-commit do hub_data.json,
    # que e' dockerignored) ou documentacao — corta o churn de deploy que causava
    # reprovisionamento de volume e perda de dados.
    paths-ignore:
      - 'data/**'
      - '**/*.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Notificar Hub de deploy
        if: success()
        env:
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST=$(printf '%s' "$COMMIT_MSG" | head -1)
          if printf '%s' "$FIRST" | grep -qiE '^hotfix'; then TIPO=hotfix
          elif printf '%s' "$FIRST" | grep -qiE '^fix'; then TIPO=fix
          elif printf '%s' "$FIRST" | grep -qiE '^feat'; then TIPO=feat
          else TIPO=melhoria; fi
          TITULO=$(printf '%s' "$FIRST" | sed 's/^[a-zA-Z-]*([^)]*): *//' | sed 's/^[a-zA-Z-]*: *//' | cut -c1-120)
          curl -sf -X POST https://hub-granmarquise.fly.dev/api/webhook/update \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $HUB_WEBHOOK_SECRET" \
            -d "$(jq -cn --arg tipo "$TIPO" --arg titulo "$TITULO" \
              '{sistemaId:"hub",sistemaNome:"Hub",tipo:$tipo,titulo:$titulo}')" || true
