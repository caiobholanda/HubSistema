name: Deploy to Fly.io

on:
  push:
    branches: [main]
    # Nao redeploya por commits que so mudam dados (auto-commit do hub_data.json,
    # que e' dockerignored) ou documentacao — corta o churn de deploy que causava
    # reprovisionamento de volume e perda de dados.
    paths-ignore:
      - 'data/**'
      - '**/*.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
